[package]
name = "FastTask"
version = "1.2.1"
description = "DailyTask"
authors = ["you"]
edition = "2021"

[lib]
name = "daily_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "charset", "system-proxy"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
