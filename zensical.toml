[project]
site_url = "https://riiimparm.github.io/FastTask/"
site_name = "FastTask Docs"
site_description = "FastTask のドキュメント"

repo_url = "https://github.com/riiimparm/FastTask"
repo_name = "riiimparm/FastTask"
edit_uri = "edit/main/docs/"

nav = [
  { "FastTask Docs" = "index.md" },
  { "Google連携セットアップ" = "google-sync.md" },
]

[project.theme]
language = "ja"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "ライトモードに切り替え"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードに切り替え"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "システム設定に従う"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
