[package]
name = "fasttask-core"
version = "1.4.1"
edition = "2021"
description = "FastTask local data API"
publish = false

[dependencies]
chrono = "0.4.44"
regex = "1.12"
serde_json = "1"
tiny_http = "0.12"
url = "2.5"
uuid = { version = "1.23", features = ["v4"] }

[[bin]]
name = "fasttask-api"
path = "src/bin/fasttask-api.rs"
